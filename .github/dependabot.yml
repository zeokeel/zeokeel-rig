# Keep the GitHub Actions used by the repository up to date.
#
# The module has one intentionally vetted dependency (mvdan.cc/sh/v3), so the gomod ecosystem is a
# safety net for the day a tool dependency appears; it should normally report
# nothing. Actions are pinned by full commit SHA in the workflows; Dependabot
# updates those pins weekly and groups them into a single PR to keep review
# noise low.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
