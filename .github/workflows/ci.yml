name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test ./... -count=1 -race
      - name: contracts/v1 must stay standard-library only
        run: |
          deps=$(go list -deps ./contracts/v1 | grep -v '^internal/' | grep '\.' || true)
          if [ -n "$deps" ]; then echo "contracts/v1 imports non-stdlib: $deps"; exit 1; fi
      - name: SDK dependency guard (kernel only)
        run: |
          deps=$(go list -m all | tail -n +2 || true)
          echo "$deps" | grep -v '^github.com/zeokeel/zeokeel-kernel ' | grep -v '^$' && { echo "unexpected dependency"; exit 1; } || true
      - name: examples build
        run: go build ./examples/...
