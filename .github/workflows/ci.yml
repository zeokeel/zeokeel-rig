name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test ./... -count=1 -race
      - name: tool catalog coverage
        run: go test ./tools/full -run TestToolCatalogCoverage -count=1 -v
      - name: zero dependencies
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then echo "unexpected dependencies: $deps"; exit 1; fi
      - name: contracts/v1 must stay standard-library only
        run: |
          deps=$(go list -deps ./contracts/v1 | grep '\.' || true)
          if [ -n "$deps" ]; then echo "contracts/v1 imports non-stdlib: $deps"; exit 1; fi
      - run: go build ./examples/...
