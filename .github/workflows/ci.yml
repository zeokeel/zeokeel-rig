name: ci

# The single gate definition: runs on every push to main and on pull requests,
# and is reused by the tag-driven release workflow through workflow_call so a
# release build runs exactly the same gates as a merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The library and every test build are cgo-free (CGO_ENABLED=0). The only
# exception is the race-detector step below, which is a Go tooling requirement
# for `-race`, not a library/build dependency.
env:
  CGO_ENABLED: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test (race)
        # The Go race detector itself requires cgo (tooling, not the library).
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -race

      - name: coverage floors
        run: |
          go test ./... -count=1 -coverprofile=/tmp/cover.out >/dev/null
          bash scripts/coverage-floor.sh /tmp/cover.out

      - name: AI tool catalog is current
        run: go run ./cmd/rigdoc -check

      - name: fuzz smoke
        run: |
          set -euo pipefail
          fuzz() {
            echo "== $1 ($2) =="
            go test -run='^$' -fuzz="^$1$" -fuzztime=5s "$2"
          }
          fuzz FuzzParseSSE ./provider/openai
          fuzz FuzzStreamDecode ./provider/openai
          fuzz FuzzDecodeRPCEnvelope ./tools/mcp
          fuzz FuzzDecodeResponseID ./tools/mcp
          fuzz FuzzReadSSEResponse ./tools/mcp
          fuzz FuzzReadMessage ./tools/lsp
          fuzz FuzzParseLSPResults ./tools/lsp
          fuzz FuzzCheckURL ./sandbox
          fuzz FuzzResolvePath ./sandbox
          fuzz FuzzParseShellCommand ./sandbox

      - name: benchmark smoke
        run: go test -run='^$' -bench=. -benchtime=1x ./provider/openai ./tools ./sandbox ./agent

      - name: tool catalog coverage
        run: go test ./tools/full -run TestToolCatalogCoverage -count=1 -v

      - name: modern tool surface audit
        run: go test ./tools/audit -count=1 -v

      - name: dependency policy
        run: |
          # Rig keeps exactly one small dependency (the POSIX shell parser used
          # by sandbox.ParseShellCommand). The module root stays stdlib-only and
          # CGO is disabled, so this asserts the *built* import set, not the
          # module graph.
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
            | grep -v '^$' | grep -v '^github.com/zeokeel/zeokeel-rig' | sort -u)
          expected=$(printf 'mvdan.cc/sh/v3/fileutil\nmvdan.cc/sh/v3/syntax')
          if [ "$deps" != "$expected" ]; then
            echo "unexpected built dependencies:"
            echo "$deps"
            exit 1
          fi
          echo "built dependencies (CGO_ENABLED=0): $deps"

      - name: cgo-free build and tests
        run: |
          # No package in the build may use cgo; the race step is the only cgo
          # tooling use in this workflow.
          if CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -q .; then
            echo "::error::the build has cgo packages; Rig must stay cgo-free"
            CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...
            exit 1
          fi
          CGO_ENABLED=0 go test ./... -count=1

      - name: root package must stay standard-library only
        run: |
          # The module root (`package rig`) is the contract leaf: it must import
          # only the Go standard library — no third-party module and no other rig
          # package (`go list -deps` includes the package itself, so exclude it).
          self="github.com/zeokeel/zeokeel-rig"
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -v '^$' \
            | grep -vxF "$self" || true)
          if [ -n "$deps" ]; then
            echo "root package imports non-stdlib packages:"
            echo "$deps"
            exit 1
          fi

      - name: README quickstart matches a compiled example
        run: |
          # The README quickstart is the source of examples/quickstart/main.go;
          # this keeps the first thing a user copies compilable.
          awk '/^```go$/{f=1;next} f&&/^```$/{exit} f' README.md > /tmp/readme-quickstart.go
          diff -u examples/quickstart/main.go /tmp/readme-quickstart.go

      - name: cross-compile and vet (windows/darwin/freebsd)
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== GOOS/GOARCH: $target =="
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
          done

      - name: build examples
        run: go build ./examples/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
