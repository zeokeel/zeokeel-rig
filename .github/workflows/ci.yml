name: ci

# The single gate definition: runs on every push to main and on pull requests,
# and is reused by the tag-driven release workflow through workflow_call so a
# release build runs exactly the same gates as a merge.
on:
  push:
    branches: [main]
  pull_request:
  # 手工触发：用于在还没开 PR 的分支上跑一次完整门禁（例如 windows-sandbox
  # 这类需要在真机采集结果的 job）。选分支后点 "Run workflow" 即可。
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The library and every test build are cgo-free (CGO_ENABLED=0). The only
# exception is the race-detector step below, which is a Go tooling requirement
# for `-race`, not a library/build dependency.
env:
  CGO_ENABLED: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # 固定镜像版本，而不是 ubuntu-latest：GitHub 会不时把 latest 迁移到新发行版
    # （当前提示将迁移到 Ubuntu 26），而本仓库的 Linux 沙箱运行期测试依赖内核的
    # user namespace / Landlock 行为——跑在哪个发行版上应当是显式选择，不能随
    # runner 升级而漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test (race)
        # The Go race detector itself requires cgo (tooling, not the library).
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -race

      - name: test (session/sqlite submodule)
        # 嵌套 module 带着 SQLite 驱动，故意不进根依赖集，所以上面的步骤会跳过它；
        # 它在这里跑自己的一整套门禁（含每包覆盖率下限）。
        #
        # **go.work 不进仓库**（提交它会让根模块的 `go test ./...` 进入 workspace
        # 模式，把子模块拉进根的 `./...`，破坏"根 module 只有一个第三方依赖"的门禁）。
        # 所以这里**临时生成**一个 workspace：子模块的 go.mod 指向的是已发布的
        # `v0.24.0`，而此刻仓库里还没有那个 tag，只有 workspace 能让它编起来。
        # 跑完删掉，`git status` 保持干净。
        working-directory: session/sqlite
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          cleanup() { rm -f go.work go.work.sum; }
          trap cleanup EXIT
          go work init ../.. && go work use .
          go build ./...
          go vet ./...
          echo "::group::cross build (darwin/arm64, windows/amd64)"
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          echo "::endgroup::"
          echo "::group::go mod tidy -diff"
          # 未 tidy 的 go.mod/go.sum 会让下游 go get 失败；-diff 在干净时无输出。
          # workspace 模式下 tidy 会把两个 module 一起整理，正好覆盖"子模块间接依赖
          # 的 go.sum 条目有没有漏"这类缺陷。
          go mod tidy -diff
          echo "::endgroup::"
          go test ./... -count=1 -coverprofile=/tmp/sqlite-cover.out >/tmp/sqlite-test.log 2>&1 || {
            grep -vE '^ok |no test files' /tmp/sqlite-test.log | tail -80; exit 1; }
          bash ../../scripts/coverage-floor.sh /tmp/sqlite-cover.out

      - name: test (session/sqlite submodule, race)
        # 竞争检测器本身需要 cgo（属于工具链，不是库）。
        working-directory: session/sqlite
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          cleanup() { rm -f go.work go.work.sum; }
          trap cleanup EXIT
          go work init ../.. && go work use .
          go test ./... -count=1 -race

      - name: coverage floors
        run: |
          # 不要把输出丢掉：以前写成 >/dev/null，测试失败时 CI 只报
          # "exit code 1"，看不出是哪个包/哪条用例（浪费过一整轮排查）。
          if ! go test ./... -count=1 -coverprofile=/tmp/cover.out >/tmp/test.log 2>&1; then
            grep -vE '^ok |no test files' /tmp/test.log | tail -80
            exit 1
          fi
          bash scripts/coverage-floor.sh /tmp/cover.out

      - name: AI tool catalog is current
        run: go run ./cmd/rigdoc -check

      - name: fuzz smoke
        run: |
          set -euo pipefail
          fuzz() {
            echo "== $1 ($2) =="
            go test -run='^$' -fuzz="^$1$" -fuzztime=5s "$2"
          }
          fuzz FuzzParseSSE ./provider/openai
          fuzz FuzzStreamDecode ./provider/openai
          fuzz FuzzDecodeRPCEnvelope ./tools/mcp
          fuzz FuzzDecodeResponseID ./tools/mcp
          fuzz FuzzReadSSEResponse ./tools/mcp
          fuzz FuzzReadMessage ./tools/lsp
          fuzz FuzzParseLSPResults ./tools/lsp
          fuzz FuzzCheckURL ./sandbox
          fuzz FuzzResolvePath ./sandbox
          fuzz FuzzParseShellCommand ./sandbox

      - name: benchmark smoke
        run: go test -run='^$' -bench=. -benchtime=1x ./provider/openai ./tools ./sandbox ./agent

      - name: tool catalog coverage
        run: go test ./tools/full -run TestToolCatalogCoverage -count=1 -v

      - name: modern tool surface audit
        run: go test ./tools/audit -count=1 -v

      - name: dependency policy
        run: |
          # Rig keeps exactly one small dependency (the POSIX shell parser used
          # by sandbox.ParseShellCommand). The module root stays stdlib-only and
          # CGO is disabled, so this asserts the *built* import set, not the
          # module graph.
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
            | grep -v '^$' | grep -v '^github.com/zeokeel/zeokeel-rig' | sort -u)
          expected=$(printf 'mvdan.cc/sh/v3/fileutil\nmvdan.cc/sh/v3/syntax')
          if [ "$deps" != "$expected" ]; then
            echo "unexpected built dependencies:"
            echo "$deps"
            exit 1
          fi
          echo "built dependencies (CGO_ENABLED=0): $deps"

      - name: cgo-free build and tests
        run: |
          # No package in the build may use cgo; the race step is the only cgo
          # tooling use in this workflow.
          if CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -q .; then
            echo "::error::the build has cgo packages; Rig must stay cgo-free"
            CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...
            exit 1
          fi
          CGO_ENABLED=0 go test ./... -count=1

      - name: root package must stay standard-library only
        run: |
          # The module root (`package rig`) is the contract leaf: it must import
          # only the Go standard library — no third-party module and no other rig
          # package (`go list -deps` includes the package itself, so exclude it).
          self="github.com/zeokeel/zeokeel-rig"
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -v '^$' \
            | grep -vxF "$self" || true)
          if [ -n "$deps" ]; then
            echo "root package imports non-stdlib packages:"
            echo "$deps"
            exit 1
          fi

      - name: README quickstart matches a compiled example
        run: |
          # The README quickstart is the source of examples/quickstart/main.go;
          # this keeps the first thing a user copies compilable.
          awk '/^```go$/{f=1;next} f&&/^```$/{exit} f' README.md > /tmp/readme-quickstart.go
          diff -u examples/quickstart/main.go /tmp/readme-quickstart.go

      - name: cross-compile and vet (windows/darwin/freebsd)
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== GOOS/GOARCH: $target =="
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
          done

      - name: build examples
        run: go build ./examples/...

  # Windows 是真机验证，不是 Wine：
  # Wine 只模拟 API 形状，**不强制** restricting SID / Low 完整性 / ACL 继承
  # （实测：受限令牌仍能写文件、LABEL_SECURITY_INFORMATION 直接失败），在它上面
  # 跑"通过"是假阳性。这个 job 用 GitHub 托管的真实 Windows runner 跑
  # sandbox/osrunner 的 `//go:build windows` 运行期测试。
  #
  # 已经是阻塞门禁（不再是 continue-on-error）：2026-11-17 在 windows-latest 上
  # 一轮全绿——纯逻辑与真机 ACL 强制（workspace-write 允许/拒绝、read-only 拒绝、
  # 保护路径、并发、受限令牌、Job 进程树、结构布局）全部通过。真机还顺带抓到了
  # 两个只有 Windows 才会暴露的 bug：命名 mutex 的跨线程释放导致并发死锁、
  # 测试命令里的引号被 syscall.EscapeArg 二次转义。
  windows-sandbox:
    name: windows sandbox (real Windows)
    # 这里**故意**不固定版本：Windows 的 ACL/Job/完整性级别语义随系统版本演进，
    # 我们希望第一时间在最新 Windows 上看到漂移（失败即信号）。它是阻塞门禁，
    # 所以真的坏了不会被忽略。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      # 只跑 Windows 沙箱后端自己的纯逻辑（它才是这个 job 的对象）。
      # `./sandbox/...` 里还有大量 POSIX 形状的断言（/etc/passwd、/dev/*、
      # chmod 权限位、符号链接），它们在 Windows 上没有意义；`./tools/...` 的
      # 终端/PTY 用例同理。跨平台的组装层由 ubuntu 的 test job 覆盖。
      - name: test (windows sandbox pure logic)
        shell: pwsh
        run: |
          # 失败时把完整测试输出写进 artifact：Actions 的日志下载在部分网络下
          # 不可达，artifact 走 api.github.com，可以用 `gh run download` 取回。
          go test ./sandbox/osrunner -count=1 -v 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: test (real Windows ACL enforcement)
        shell: pwsh
        run: |
          $env:RIG_WINDOWS_SANDBOX_TEST = "1"
          go test ./sandbox/osrunner -run TestWindowsRuntime -count=1 -v 2>&1 |
            Tee-Object -FilePath windows-enforcement.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sandbox-test-log
          path: |
            windows-test.log
            windows-enforcement.log
          if-no-files-found: warn

  lint:
    name: lint
    # 固定镜像版本，而不是 ubuntu-latest：GitHub 会不时把 latest 迁移到新发行版
    # （当前提示将迁移到 Ubuntu 26），而本仓库的 Linux 沙箱运行期测试依赖内核的
    # user namespace / Landlock 行为——跑在哪个发行版上应当是显式选择，不能随
    # runner 升级而漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  sqlite-consumer-smoke:
    name: sqlite-consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: session/sqlite/go.mod
          cache: false
      - name: 下游消费冒烟（临时 module 里 go get 子模块）
        # 这条门禁是"子模块能不能被宿主真的用起来"的唯一证据：
        #   - 用 file:// 模块代理把当前 checkout 打成子模块 require 的那个版本；
        #   - 在**临时 module** 里 go get 子模块并编译——那里没有 go.work、没有
        #     replace，任何"本地能编、宿主不能编"的问题（go.sum 缺项、require 指错
        #     版本、依赖了未发布的主模块 API）都会在这里暴露。
        #
        # 三个曾经让这条门禁假绿/假红、必须保持的细节：
        #   1. **根模块也要 stage**。只 stage 子模块时，子模块 import 的
        #      `github.com/zeokeel/zeokeel-rig/...` 全部解析失败（旧脚本的
        #      `dir == "."` 分支是死代码，从未被调用）。
        #   2. **GOPROXY 必须带真实代理回退**。file:// 代理只装得下本仓两个 module，
        #      `modernc.org/sqlite` 这类第三方依赖不可能在里面；只写 file:// 时
        #      go get 直接报 `reading file:///…/modernc.org/sqlite/@v/v1.62.0.zip:
        #      no such file or directory`。
        #   3. **版本号取自子模块 go.mod 的 require**，不写死。写死会在 require
        #      bump 之后对着一个不存在的版本跑（或对着旧版本"通过"）。
        run: |
          set -eu
          # 被消费的版本 = 子模块 require 的主模块版本。
          version="$(sed -nE \
            's/^[[:space:]]*(require[[:space:]]+)?github\.com\/zeokeel\/zeokeel-rig[[:space:]]+(v[0-9][^[:space:]]*).*/\2/p' \
            session/sqlite/go.mod | head -1)"
          if [ -z "$version" ]; then
            echo "::error::session/sqlite/go.mod 里找不到 github.com/zeokeel/zeokeel-rig 的 require"
            exit 1
          fi
          echo "consuming session/sqlite at $version (root module staged at the same version)"

          proxy="$(mktemp -d)"
          # stage MODULE DIR：把 DIR 打包成 MODULE@version 的 zip 放进 file:// 代理。
          #   - zip 条目必须带 `MODULE@version/` 前缀，且只含**该模块自己的**文件，
          #     否则 Go 报 `zip for … has unexpected file <x>`。
          #   - 文件列表取自 `git ls-files --cached --others --exclude-standard`
          #     （= git 会提交的内容；CI 的干净 checkout 与工作树一致），而不是
          #     `tar -c .`：后者会把本地未跟踪的 .audit*/ 之类一起塞进 zip。
          #   - 嵌套 module 的目录必须整体排除（`scripts/wine-probe`、`session/`
          #     都有自己的 go.mod），否则 Go 报
          #     `go.mod file not in module root directory`。
          stage() {
            mod="$1"; dir="$2"
            abs="$(cd "$dir" && pwd)"
            out="$proxy/$mod/@v"
            mkdir -p "$out"
            printf '{"Version":"%s","Time":"%s"}\n' "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out/$version.info"
            cp "$abs/go.mod" "$out/$version.mod"
            if [ "$(sed -nE 's/^module[[:space:]]+([^[:space:]]+).*/\1/p' "$abs/go.mod")" != "$mod" ]; then
              echo "::error::$dir/go.mod 的 module 路径不是 $mod"
              exit 1
            fi
            excludes=()
            while IFS= read -r nested; do
              [ -n "$nested" ] || continue
              echo "  excluding nested module: $nested"
              excludes+=(":(exclude)$nested" ":(exclude)$nested/**")
            done < <( cd "$abs" && git ls-files -z --cached --others --exclude-standard \
                | tr '\0' '\n' | grep -E '(^|/)go\.mod$' | grep -vx 'go\.mod' \
                | sed -E 's#/go\.mod$##' )
            list="$(mktemp)"
            ( cd "$abs" && git ls-files -z --cached --others --exclude-standard -- . \
                "${excludes[@]+"${excludes[@]}"}" ) > "$list"
            tmp="$(mktemp -d)"
            mkdir -p "$tmp/$mod@$version"
            tar -C "$abs" --null -T "$list" -c -f - | tar -x -C "$tmp/$mod@$version"
            ( cd "$tmp" && zip -qr "$out/$version.zip" "$mod@$version" ) >/dev/null
            rm -rf "$tmp" "$list"
            echo "staged $mod@$version"
          }
          stage github.com/zeokeel/zeokeel-rig .
          stage github.com/zeokeel/zeokeel-rig/session/sqlite session/sqlite

          work="$(mktemp -d)"
          cd "$work"
          go mod init smoke >/dev/null
          cat > main.go <<'EOF'
          package main

          import (
          	"context"
          	"os"
          	"path/filepath"

          	"github.com/zeokeel/zeokeel-rig/session/sqlite"
          )

          func main() {
          	dir, err := os.MkdirTemp("", "smoke")
          	if err != nil {
          		panic(err)
          	}
          	db, err := sqlite.Open(sqlite.Options{Path: filepath.Join(dir, "s.db")})
          	if err != nil {
          		panic(err)
          	}
          	defer db.Close()
          	if _, err := db.Schema(context.Background()); err != nil {
          		panic(err)
          	}
          }
          EOF
          # file:// 只负责本仓两个 module；第三方依赖（modernc.org/* 等）回退到真实
          # 代理。逗号回退**只在上一项报 404/410 时**发生——file:// 代理对缺失文件
          # 正是这么报的（实测：根模块/第三方依赖都能正确落到下一项）。
          export GOPROXY="file://$proxy,https://proxy.golang.org,direct"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          go get "github.com/zeokeel/zeokeel-rig/session/sqlite@$version"
          go build ./...
          echo "consumer smoke OK: session/sqlite@$version (root $version) go get + go build"

  # 子模块的 require 与 tag 一致性：这是"漏打 tag"唯一能被发现的地方。
  #
  # 为什么必须单独一个 job、并且**不在 PR 上跑**：一个 PR 把 require bump 到
  # `vX.Y.Z`（本次要发的版本）时，`vX.Y.Z` 这个 tag 还不存在——那是合并后发布时
  # 才打的。把这条门禁放进 PR 就变成永远红，PR 反而会学会无视它；放在 push(main)
  # 与 workflow_call(release) 上，main 与 release 都必须绿，于是"发了根 tag 却没发
  # 子模块 tag"、"require 指着一个不存在的版本"都会当场红。
  submodule-release-tags:
    name: submodule release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 只在 tag 上跑：这道门禁验的是"发布面自洽"（require == 最近根 tag、且子模块 tag 存在）。
    # 在 main 的普通 push 上跑必然红（待发版的 tag 本来就是发版时才打），会把主 CI 长期染红，
    # 人就会开始忽略红——那是比没有门禁更糟的状态。
    if: starts_with(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tag 不在默认的浅克隆里；没有 tag 这条门禁只能瞎猜。
          fetch-depth: 0
      - name: 子模块 require 必须等于最近根 tag，且对应子模块 tag 存在
        run: |
          set -eu
          root_tag="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$root_tag" ]; then
            echo "::error::找不到任何根 module tag（vX.Y.Z）：无法校验子模块版本"
            echo "  checkout 必须带 tag（fetch-depth: 0）。"
            exit 1
          fi
          required="$(sed -nE \
            's/^[[:space:]]*(require[[:space:]]+)?github\.com\/zeokeel\/zeokeel-rig[[:space:]]+(v[0-9][^[:space:]]*).*/\2/p' \
            session/sqlite/go.mod | head -1)"
          if [ -z "$required" ]; then
            echo "::error::session/sqlite/go.mod 没有 require github.com/zeokeel/zeokeel-rig"
            exit 1
          fi
          echo "latest root tag: $root_tag"
          echo "submodule require: $required"

          fail=0
          if [ "$required" != "$root_tag" ]; then
            echo "::error::session/sqlite/go.mod 的 require ($required) 与最近根 tag ($root_tag) 不一致"
            echo "  两种合法状态：① 已发布 —— require 与最近根 tag 相同；"
            echo "  ② 正在准备下一个版本 —— 先发根 tag，再发子模块 tag（docs/RELEASE.md §子模块 tag）。"
            echo "  注意 replace ../.. 只在**本仓内**生效，依赖方会忽略它，它掩盖不了这个不一致。"
            fail=1
          fi

          sub_tag="session/sqlite/$root_tag"
          if git rev-parse -q --verify "refs/tags/$sub_tag^{commit}" >/dev/null; then
            if ! git merge-base --is-ancestor "refs/tags/$root_tag^{commit}" "refs/tags/$sub_tag^{commit}"; then
              echo "::error::$sub_tag 不包含 $root_tag 的提交"
              echo "  修法：$sub_tag 必须打在同一个（或更晚的）提交上。"
              fail=1
            fi
          else
            echo "::error::缺少子模块 tag $sub_tag：下游 go get github.com/zeokeel/zeokeel-rig/session/sqlite@$root_tag 会失败"
            echo "  修法（顺序不能反，根 tag 先）："
            echo "    git tag -s $sub_tag -m \"session/sqlite $root_tag\""
            echo "    git push origin $sub_tag"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: require $required == 最近根 tag，且 $sub_tag 存在"
