name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test (race)
        run: go test ./... -count=1 -race

      - name: tool catalog coverage
        run: go test ./tools/full -run TestToolCatalogCoverage -count=1 -v

      - name: modern tool surface audit
        run: go test ./tools/audit -count=1 -v

      - name: zero dependencies
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "unexpected dependencies: $deps"
            exit 1
          fi

      - name: root package must stay standard-library only
        run: |
          # The module root (`package rig`) is the contract leaf: it must import
          # only the Go standard library — no third-party module and no other rig
          # package (`go list -deps` includes the package itself, so exclude it).
          self="github.com/zeokeel/zeokeel-rig"
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -v '^$' \
            | grep -vxF "$self" || true)
          if [ -n "$deps" ]; then
            echo "root package imports non-stdlib packages:"
            echo "$deps"
            exit 1
          fi

      - name: README quickstart matches a compiled example
        run: |
          # The README quickstart is the source of examples/quickstart/main.go;
          # this keeps the first thing a user copies compilable.
          awk '/^```go$/{f=1;next} f&&/^```$/{exit} f' README.md > /tmp/readme-quickstart.go
          diff -u examples/quickstart/main.go /tmp/readme-quickstart.go

      - name: cross-compile
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== GOOS/GOARCH: $target =="
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

      - name: build examples
        run: go build ./examples/...
