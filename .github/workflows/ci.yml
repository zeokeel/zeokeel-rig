name: ci

# The single **code** gate: runs on every push to main and on pull requests, and
# is reused by the tag-driven release workflow through workflow_call so a release
# build runs exactly the same gates as a merge.
#
# Scope: correctness of the code (format/build/vet/tests/race/coverage/
# dependency+cgo policy/cross-compile/tool-surface). Each of those concerns is its
# own job: `test` holds only what has to run in one pass (the `-race` suite and the
# coverage floor), while `cross` / `examples` / `catalog` / `policy` run **in
# parallel** with it, so the PR critical path is the slowest single job rather than
# the sum of all steps. 深度 fuzz（10 个目标 × 5s）
# 与 benchmark 冒烟不在 PR 上跑，见 `nightly.yml`；PR 只留"fuzz 入口还在"的
# 存在性 + 1s 冒烟。Documentation and
# release-version consistency are deliberately **not** CI gates: docs live in the
# repo and are reviewed like code, and version/tag checks belong to the release
# workflow (release.yml), not to every push.
on:
  push:
    branches: [main]
  pull_request:
  # 手工触发：用于在还没开 PR 的分支上跑一次完整门禁（例如 windows-sandbox
  # 这类需要在真机采集结果的 job）。选分支后点 "Run workflow" 即可。
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The library and every test build are cgo-free (CGO_ENABLED=0). The only
# exception is the race-detector step below, which is a Go tooling requirement
# for `-race`, not a library/build dependency.
env:
  CGO_ENABLED: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # 固定镜像版本，而不是 ubuntu-latest：GitHub 会不时把 latest 迁移到新发行版
    # （当前提示将迁移到 Ubuntu 26），而本仓库的 Linux 沙箱运行期测试依赖内核的
    # user namespace / Landlock 行为——跑在哪个发行版上应当是显式选择，不能随
    # runner 升级而漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # 一次全量测试同时给出 plain / race / 覆盖率三件事的结论：
      #   - `-race` 会跑**全部**用例，所以它天然包含原来单独那次 plain 执行；
      #   - `-coverprofile` 与 `-race` 可以同时给，合成的 profile 直接喂下面的
      #     覆盖率门禁（不用再为它跑第三遍）。
      #
      # 以前这里是三步各跑一遍 `./...`（plain、`-race`、`-coverprofile`），
      # 在 PR #32 上 `test` job 的 7m54s 里绝大部分是这份重复开销。
      #
      # 代价（给后来人）：`-coverprofile` 会给被测包插桩，热路径上的开销可观
      # （实测 `ClassifyShellCommand` 的 1000 级管道：plain ~5ms → `-race` 20ms →
      # `-race -coverprofile` 70–80ms）。所以**用例不要断言绝对墙钟预算**，否则
      # 合并后的这条链路会把原来"刚好绿"的计时断言推到阈值线附近。
      - name: test (race + coverage, single pass)
        # The Go race detector itself requires cgo (tooling, not the library).
        env:
          CGO_ENABLED: "1"
        run: |
          # 不要把输出丢掉：以前写成 >/dev/null，测试失败时 CI 只报
          # "exit code 1"，看不出是哪个包/哪条用例（浪费过一整轮排查）。
          if ! go test ./... -count=1 -race -coverprofile=/tmp/cover.out >/tmp/test.log 2>&1; then
            grep -vE '^ok |no test files' /tmp/test.log | tail -120
            exit 1
          fi

      - name: coverage floors
        # 只**读**上一步合成的 profile：这一步以前会为此再跑一遍完整 `go test ./...`。
        # 保留成独立步骤，是为了让"覆盖率不达标"与"用例失败"在 Actions 里分别可见。
        run: bash scripts/coverage-floor.sh /tmp/cover.out

      - name: test (session/sqlite submodule)
        # 嵌套 module 带着 SQLite 驱动，故意不进根依赖集，所以上面的步骤会跳过它；
        # 它在这里跑自己的一整套门禁（含每包覆盖率下限）。
        #
        # **go.work 不进仓库**（提交它会让根模块的 `go test ./...` 进入 workspace
        # 模式，把子模块拉进根的 `./...`，破坏"根 module 只有一个第三方依赖"的门禁）。
        # 所以这里**临时生成**一个 workspace：子模块的 go.mod 指向的是已发布的
        # `v0.24.0`，而此刻仓库里还没有那个 tag，只有 workspace 能让它编起来。
        # 跑完删掉，`git status` 保持干净。
        #
        # 与根模块同一套合并：build/vet/tidy/交叉编译之后**一次** `-race -coverprofile`
        # 全量测试（以前是 plain+coverage 一次、race 再一次）。竞争检测器需要 cgo
        # （属于工具链，不是库），所以构建类命令显式带 CGO_ENABLED=0。
        working-directory: session/sqlite
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          cleanup() { rm -f go.work go.work.sum; }
          trap cleanup EXIT
          go work init ../.. && go work use .
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go vet ./...
          echo "::group::cross build (darwin/arm64, windows/amd64)"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          echo "::endgroup::"
          echo "::group::go mod tidy -diff"
          # 未 tidy 的 go.mod/go.sum 会让下游 go get 失败；-diff 在干净时无输出。
          # workspace 模式下 tidy 会把两个 module 一起整理，正好覆盖"子模块间接依赖
          # 的 go.sum 条目有没有漏"这类缺陷。
          go mod tidy -diff
          echo "::endgroup::"
          go test ./... -count=1 -race -coverprofile=/tmp/sqlite-cover.out >/tmp/sqlite-test.log 2>&1 || {
            grep -vE '^ok |no test files' /tmp/sqlite-test.log | tail -80; exit 1; }
          bash ../../scripts/coverage-floor.sh /tmp/sqlite-cover.out

      - name: fuzz entrypoints (existence + 1s smoke)
        # 10 个目标 × 5s 的深度冒烟搬到了 `nightly.yml`（每天一次 + 手动触发）：
        # 它几乎只在"输入面被改动"时才可能报出新东西，在 PR 上给每次提交加 50s+
        # 长尾，反馈价值却接近零。PR 上保留两件事：
        #   1. 这 10 个目标都还在（被删/改名立刻红，否则 nightly 会静默空跑）；
        #   2. 一个目标真的能 `-fuzz` 起来（证明 fuzz 入口没坏）。
        run: |
          set -euo pipefail
          expected="FuzzCheckURL FuzzDecodeRPCEnvelope FuzzDecodeResponseID FuzzParseLSPResults FuzzParseSSE FuzzParseShellCommand FuzzReadMessage FuzzReadSSEResponse FuzzResolvePath FuzzStreamDecode"
          found="$(go test -run='^$' -list='^Fuzz' ./provider/openai ./tools/mcp ./tools/lsp ./sandbox \
            | grep '^Fuzz' | sort -u | tr '\n' ' ' | sed 's/ $//')"
          missing=""
          for target in $expected; do
            case " $found " in
              *" $target "*) ;;
              *) missing="$missing $target" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::fuzz 目标缺失:$missing"
            echo "现有: $found"
            exit 1
          fi
          echo "fuzz 目标齐备: $found"
          # 只跑一个目标 1s：这里证明"入口可用"，挖 bug 的职责在 nightly。
          go test -run='^$' -fuzz='^FuzzParseSSE$' -fuzztime=1s ./provider/openai

      - name: cgo-free build (plus sandbox tests only)
        run: |
          # No package in the build may use cgo; the race step is the only cgo
          # tooling use in this workflow.
          if CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -q .; then
            echo "::error::the build has cgo packages; Rig must stay cgo-free"
            CGO_ENABLED=0 go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...
            exit 1
          fi
          # 这一步以前是第 4 次完整 `go test ./...`。它真正想守住的是"cgo-free
          # 配置下连**测试文件**也编得过"——那由显式 `CGO_ENABLED=0` 的构建加上
          # 上面的 `go vet ./...`（会类型检查测试文件）保证，不必再跑整套用例。
          CGO_ENABLED=0 go build ./...
          # 只保留 `./sandbox/...` 的测试：它是唯一"cgo 开关会改变运行期行为"的
          # 地方——`CGO_ENABLED=1` 时 `os/user`/`net` 会换到 libc 实现，而沙箱用例
          # 恰恰在断言"子进程到底能写哪些路径"。成本约 2s，换一个真实的 cgo-free
          # 运行期结论。
          CGO_ENABLED=0 go test ./sandbox/... -count=1

  # 下面四个 job 与 `test` **并行**：它们各自只证明一件事，彼此不共享状态，
  # 也没有任何一条需要等 `test` 的用例结果。以前它们串在 `test` 里，PR 的关键
  # 路径等于"所有步骤相加"；拆开后关键路径只等**最慢的那一条**。
  #
  # 拆分不降低门禁强度：命令原样搬过去，失败照样让整个 run 变红。但它们是否
  # 阻塞合并，取决于仓库设置里的必需检查列表（不在仓库文件里）——新增 job 后
  # 维护者要把下面的名字加进必需检查，见 `docs/RELEASE.md`。
  cross:
    name: cross
    # 与 `test` 同一个固定镜像：交叉编译 + `GOOS` vet 的结论不该随 runner 发行版漂移。
    runs-on: ubuntu-24.04
    # 三个目标 × (build + vet) 都是全量编译，比 test 的用例时间短、比 examples 长。
    timeout-minutes: 15
    # 与 workflow 级默认同值，但写在这里让每个 job 自带结论：交叉编译只能是 cgo-free。
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile and vet (windows/darwin/freebsd)
        # 原样保留：先 `go build ./...` 再 `go vet ./...`，两者都带目标 GOOS/GOARCH。
        # 交叉目标不可能用 cgo，所以这里显式 CGO_ENABLED=0（与 job 级 env 一致）。
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== GOOS/GOARCH: $target =="
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
          done

  examples:
    name: examples
    runs-on: ubuntu-24.04
    # 只有一条 `go build ./examples/...`，但它会把整个依赖图编一遍。
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build examples
        run: go build ./examples/...

  catalog:
    name: catalog
    runs-on: ubuntu-24.04
    # 两个小包的测试（账本覆盖 + 现代工具面审计），各约十几秒，加上 setup-go 的固定开销。
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: tool catalog coverage
        # `tools/catalog` 的账本口径：Static/Legacy/Modern/ServerBound 与实际注册的
        # 工具集合必须对齐，增删工具漏改账本时这一步必须红。
        run: go test ./tools/full -run TestToolCatalogCoverage -count=1 -v

      - name: modern tool surface audit
        # 现代工具面对照审计（reference vs Rig），由 `tools/audit` 的测试强制。
        run: go test ./tools/audit -count=1 -v

  policy:
    name: policy
    runs-on: ubuntu-24.04
    # 两条 `go list -deps` 断言，几乎没有编译开销（`go list` 只解析导入图）。
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: dependency policy
        run: |
          # Rig keeps exactly one small dependency (the POSIX shell parser used
          # by sandbox.ParseShellCommand). The module root stays stdlib-only and
          # CGO is disabled, so this asserts the *built* import set, not the
          # module graph.
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
            | grep -v '^$' | grep -v '^github.com/zeokeel/zeokeel-rig' | sort -u)
          expected=$(printf 'github.com/dustin/go-humanize\ngithub.com/google/uuid\ngithub.com/remyoudompheng/bigfft\ngolang.org/x/sys/unix\nmodernc.org/libc\nmodernc.org/libc/sys/types\nmodernc.org/libc/uuid/uuid\nmodernc.org/mathutil\nmodernc.org/memory\nmodernc.org/sqlite\nmodernc.org/sqlite/lib\nmodernc.org/sqlite/vtab\nmvdan.cc/sh/v3/fileutil\nmvdan.cc/sh/v3/syntax')
          if [ "$deps" != "$expected" ]; then
            echo "unexpected built dependencies:"
            echo "$deps"
            exit 1
          fi
          echo "built dependencies (CGO_ENABLED=0): $deps"

      - name: root package must stay standard-library only
        run: |
          # The module root (`package rig`) is the contract leaf: it must import
          # only the Go standard library — no third-party module and no other rig
          # package (`go list -deps` includes the package itself, so exclude it).
          self="github.com/zeokeel/zeokeel-rig"
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -v '^$' \
            | grep -vxF "$self" || true)
          if [ -n "$deps" ]; then
            echo "root package imports non-stdlib packages:"
            echo "$deps"
            exit 1
          fi

  # Windows 是真机验证，不是 Wine：
  # Wine 只模拟 API 形状，**不强制** restricting SID / Low 完整性 / ACL 继承
  # （实测：受限令牌仍能写文件、LABEL_SECURITY_INFORMATION 直接失败），在它上面
  # 跑"通过"是假阳性。这个 job 用 GitHub 托管的真实 Windows runner 跑
  # sandbox/osrunner 的 `//go:build windows` 运行期测试。
  #
  # 已经是阻塞门禁（不再是 continue-on-error）：2026-11-17 在 windows-latest 上
  # 一轮全绿——纯逻辑与真机 ACL 强制（workspace-write 允许/拒绝、read-only 拒绝、
  # 保护路径、并发、受限令牌、Job 进程树、结构布局）全部通过。真机还顺带抓到了
  # 两个只有 Windows 才会暴露的 bug：命名 mutex 的跨线程释放导致并发死锁、
  # 测试命令里的引号被 syscall.EscapeArg 二次转义。
  windows-sandbox:
    name: windows sandbox (real Windows)
    # 这里**故意**不固定版本：Windows 的 ACL/Job/完整性级别语义随系统版本演进，
    # 我们希望第一时间在最新 Windows 上看到漂移（失败即信号）。它是阻塞门禁，
    # 所以真的坏了不会被忽略。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      # 只跑 Windows 沙箱后端自己的纯逻辑（它才是这个 job 的对象）。
      # `./sandbox/...` 里还有大量 POSIX 形状的断言（/etc/passwd、/dev/*、
      # chmod 权限位、符号链接），它们在 Windows 上没有意义；`./tools/...` 的
      # 终端/PTY 用例同理。跨平台的组装层由 ubuntu 的 test job 覆盖。
      - name: test (windows sandbox pure logic)
        shell: pwsh
        run: |
          # 失败时把完整测试输出写进 artifact：Actions 的日志下载在部分网络下
          # 不可达，artifact 走 api.github.com，可以用 `gh run download` 取回。
          go test ./sandbox/osrunner -count=1 -v 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: test (real Windows ACL enforcement)
        shell: pwsh
        run: |
          $env:RIG_WINDOWS_SANDBOX_TEST = "1"
          go test ./sandbox/osrunner -run TestWindowsRuntime -count=1 -v 2>&1 |
            Tee-Object -FilePath windows-enforcement.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sandbox-test-log
          path: |
            windows-test.log
            windows-enforcement.log
          if-no-files-found: warn

  lint:
    name: lint
    # 固定镜像版本，而不是 ubuntu-latest：GitHub 会不时把 latest 迁移到新发行版
    # （当前提示将迁移到 Ubuntu 26），而本仓库的 Linux 沙箱运行期测试依赖内核的
    # user namespace / Landlock 行为——跑在哪个发行版上应当是显式选择，不能随
    # runner 升级而漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  sqlite-consumer-smoke:
    name: sqlite-consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: session/sqlite/go.mod
          # 冒烟必须从**空的模块缓存**开始：缓存命中会掩盖"依赖根本取不到"这类问题。
          cache: false
      - name: 下游消费冒烟（临时 module 里 go get 子模块）
        # 这条门禁是"子模块能不能被宿主真的用起来"的唯一证据：在**临时 module** 里
        # go get 子模块、编译并运行——那里没有 go.work、没有 replace，任何"本地能编、
        # 宿主不能编"的问题（go.sum 缺项、require 指错版本、依赖了未发布的根 module
        # API）都会在这里暴露。
        #
        # 旧脚本是假门禁，三个缺陷（都实测过）：
        #   1. 根 module 的打包分支**从未被调用**（只有 `stage … session/sqlite`），
        #      子模块 import 的 `github.com/zeokeel/zeokeel-rig/...` 全部解析失败；
        #   2. `GOPROXY` 只有 `file://`，而 `modernc.org/sqlite` 这类第三方依赖
        #      不可能出现在本地文件代理里；
        #   3. 版本号写死 `v0.24.0`，require 一 bump 就对着不存在的版本跑。
        #
        # 写法上刻意避开两处高危：文件列表不用 `git ls-files | tr | grep | sed` 管道
        # （改用 `git archive`：只导出已提交内容，不夹带未跟踪目录，也不需要一长串
        # 排除规则）；job 里没有 `if:`/表达式，只有纯 shell。
        run: |
          set -eu
          # 被消费的版本 = 子模块 require 的主模块版本（读，不写死）。
          version="$(sed -nE 's/^[[:space:]]*(require[[:space:]]+)?github\.com\/zeokeel\/zeokeel-rig[[:space:]]+(v[0-9][^[:space:]]*).*/\2/p' session/sqlite/go.mod | head -1)"
          if [ -z "$version" ]; then
            echo "::error::session/sqlite/go.mod 里找不到 github.com/zeokeel/zeokeel-rig 的 require"
            exit 1
          fi
          echo "consuming session/sqlite@$version（根 module 以同一版本打包）"

          proxy="$(mktemp -d)"
          # stage MODULE TREEISH：把一棵树打成 MODULE@version 的 zip 放进 file:// 代理。
          #   - zip 条目必须正好是 `MODULE@version/…`，不能多包一层目录、也不能只包
          #     部分文件（否则 Go 报 `zip for … has unexpected file …`）；
          #   - 嵌套 module 必须**整目录**排除：`session/sqlite`、`scripts/wine-probe`
          #     都有自己的 go.mod，留在根 zip 里 Go 报 `go.mod file not in module root
          #     directory`。判据写成"目录里有 go.mod 且不是模块根"，所以以后再新增
          #     嵌套 module 不用改这里；
          #   - `zip -D` 不写目录条目：Go 只接受 `MODULE@version/` 前缀下的文件条目，
          #     多余的目录条目同样会被判成 unexpected file。
          stage() {
            mod="$1"
            rev="$2"
            out="$proxy/$mod/@v"
            mkdir -p "$out"
            base="$(mktemp -d)"
            root="$base/$mod@$version"
            mkdir -p "$root"
            tarfile="$(mktemp)"
            git archive --format=tar -o "$tarfile" "$rev"
            tar -xf "$tarfile" -C "$root"
            rm -f "$tarfile"
            for nested in $(find "$root" -mindepth 2 -name go.mod -printf '%h\n'); do
              case "$nested" in
                "$root"/*)
                  echo "  excluding nested module dir: ${nested#"$root"/}"
                  rm -rf "$nested"
                  ;;
                *)
                  echo "::error::refusing to delete outside staging: $nested"
                  exit 1
                  ;;
              esac
            done
            leftover="$(find "$root" -mindepth 2 -name go.mod -print)"
            if [ -n "$leftover" ]; then
              echo "::error::nested go.mod still present after pruning: $leftover"
              exit 1
            fi
            got="$(sed -nE 's/^module[[:space:]]+([^[:space:]]+).*/\1/p' "$root/go.mod")"
            if [ "$got" != "$mod" ]; then
              echo "::error::$rev has module path '$got', expected '$mod'"
              exit 1
            fi
            info="$(printf '{"Version":"%s","Time":"%s"}' "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
            printf '%s\n' "$info" > "$out/$version.info"
            cp "$root/go.mod" "$out/$version.mod"
            ( cd "$base" && zip -qrD "$out/$version.zip" "$mod@$version" ) >/dev/null
            # `@v/list` 与 `@latest` 不是可选装饰：`go run pkg@version` 在下载前会查
            # 一次 `<module>/@v/list` / `<module>/@latest`（deprecation 查询），缺了
            # 它们 Go 会回落到下一个代理（公网）——无外网的 runner 上这一步直接失败。
            printf '%s\n' "$version" > "$out/list"
            printf '%s\n' "$info" > "$proxy/$mod/@latest"
            echo "staged $mod@$version ($(find "$root" -type f | wc -l) files)"
            rm -rf "$base"
          }
          stage github.com/zeokeel/zeokeel-rig HEAD
          stage github.com/zeokeel/zeokeel-rig/session/sqlite HEAD:session/sqlite

          work="$(mktemp -d)"
          cd "$work"
          go mod init smoke >/dev/null
          cat > main.go <<'EOF'
          package main

          import (
          	"context"
          	"os"
          	"path/filepath"

          	"github.com/zeokeel/zeokeel-rig/session/sqlite"
          )

          func main() {
          	dir, err := os.MkdirTemp("", "smoke")
          	if err != nil {
          		panic(err)
          	}
          	db, err := sqlite.Open(sqlite.Options{Path: filepath.Join(dir, "s.db")})
          	if err != nil {
          		panic(err)
          	}
          	defer db.Close()
          	if _, err := db.Schema(context.Background()); err != nil {
          		panic(err)
          	}
          }
          EOF
          # 显式的空模块缓存：这条门禁要证明"依赖能从代理取到"，不是"缓存里本来就有"。
          export GOMODCACHE="$(mktemp -d)"
          # file:// 只管本仓两个 module；第三方依赖（modernc.org/* 等）回退真实代理。
          # 逗号回退在上一项报 not-found 时发生，file:// 代理对缺失文件正是这么报的。
          export GOPROXY="file://$proxy,https://proxy.golang.org,direct"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          go get "github.com/zeokeel/zeokeel-rig/session/sqlite@$version"
          go build ./...
          go run .
          echo "consumer smoke OK: session/sqlite@$version 在空模块缓存里 go get + go build + go run 通过"
          # 下一步（host-migration smoke）复用这里的 file:// 代理与版本号：
          # 根 module 尚未发布到公共代理，只有这份 stage 出来的内容能 go get。
          if [ -n "${GITHUB_ENV:-}" ]; then
            {
              echo "RIG_SMOKE_PROXY=$proxy"
              echo "RIG_SMOKE_VERSION=$version"
            } >> "$GITHUB_ENV"
          fi

      - name: host-migration smoke
        # 宿主升级的第一个入口是 rigmigrate：在**临时 module** 里 go get 本仓，
        # 再把一个"旧写法"样例目录交给 -C 扫一遍。
        #
        # 样例放在 `_sample/` 是有意的：Go 工具忽略下划线目录，所以样例里那些
        # 已删除的 API 不会让任何 `go build ./...` 变红——扫描器必须能在"编译不过"
        # 的目录上工作，那正是宿主升级时的真实状态。
        #
        # 依赖上一步写入 $GITHUB_ENV 的 file:// 代理：根 module 还没发布到公共代理，
        # 没有那份 stage 就 go get 不到。
        run: |
          set -eu
          if [ -z "${RIG_SMOKE_PROXY:-}" ] || [ -z "${RIG_SMOKE_VERSION:-}" ]; then
            echo "::error::缺少 RIG_SMOKE_PROXY / RIG_SMOKE_VERSION（上一步的 stage 没跑到？）"
            exit 1
          fi
          export GOPROXY="file://$RIG_SMOKE_PROXY,https://proxy.golang.org,direct"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          work="$(mktemp -d)"
          cd "$work"
          go mod init hostmig >/dev/null
          go get "github.com/zeokeel/zeokeel-rig@$RIG_SMOKE_VERSION"
          mkdir -p _sample
          cat > _sample/main.go <<'EOF'
          package sample

          import (
          	"github.com/zeokeel/zeokeel-rig/kit"
          	"github.com/zeokeel/zeokeel-rig/sandbox"
          )

          func build() {
          	_ = kit.Config{Redactor: nil}
          	_ = sandbox.WithProtectedPaths("/root/.ssh")
          	_ = kit.NewEventSink(nil, nil)
          	_, _ = sandbox.ValidateWritableGrantPath("/x", nil, nil, nil, nil)
          }
          EOF
          set +e
          out="$(go run "github.com/zeokeel/zeokeel-rig/cmd/rigmigrate@$RIG_SMOKE_VERSION" -C _sample -json 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::rigmigrate exit=$code, want 1（发现命中才返回 1）"
            exit 1
          fi
          # 断言"恰好 4 条、集合等于预期"，而不是"每个符号至少出现一次"：
          # 后者放过多余命中与重复命中（例如把 `_sample` 里的注释也算一条），
          # 扫描器退化成噪音机器时这条门禁仍然会绿。
          expected="$(printf '%s\n' \
            kit.Config.Redactor \
            kit.NewEventSink \
            sandbox.ValidateWritableGrantPath \
            sandbox.WithProtectedPaths | sort)"
          actual="$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*"old": "\([^"]*\)".*$/\1/p' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::rigmigrate -json 的命中集合与预期不一致"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          count="$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*"count": \([0-9]\{1,\}\).*$/\1/p')"
          if [ "$count" != "4" ]; then
            echo "::error::rigmigrate count=$count, want 4"
            exit 1
          fi
          echo "host migration smoke OK: rigmigrate 在临时 module 里报出了恰好 4 条已删除 API"
