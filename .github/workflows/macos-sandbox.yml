# 真机 macOS 沙箱验证（独立 workflow）
#
# 为什么单独一个 workflow 而不是放在 ci.yml 里：2026-11-18 起 macOS job 被系统性取消——
# `started_at` → `completed_at` 恰好 15 分 02 秒且 **steps 为空**（一个步骤都没执行），
# 而同一天早些时候同一个 job 96 秒跑绿。这是 runner 侧的调度/启动问题，不是我们的测试
# （已用 `-timeout` 排除"用例挂住"：真有挂住的用例，Go 会先打印 goroutine 栈并失败退出）。
# 而**被取消的 job 无法用 continue-on-error 中和**，会连累整个 run 变红——所以把它移出
# 阻塞链路：它自己独立跑、独立红绿，不阻塞 main 与发布。
#
# runner 侧恢复稳定后，可以把它并回 ci.yml（并恢复为阻塞门禁）。
name: macos sandbox

on:
  push:
    branches: [main]
    # main 上**永远**跑（不再有 paths 过滤）：合并进 main 的提交是发版对象，
    # 这里漏一次就意味着"某个已发布的版本从没在 macOS 真机上跑过沙箱测试"。
    # 一次 macOS job 约 1.5–6 分钟，一天几十次推送完全付得起。
  # PR 上保留 paths 过滤（托管 macOS runner 的排队与费用都更贵），但过滤面必须覆盖
  # "任何可能影响 osrunner/沙箱行为的 Go 改动"：
  #   - sandbox/**            → 策略层与 osrunner 本体
  #   - internal/procattr/**  → 子进程属性（Seatbelt 包装就靠它）
  #   - tools/builtin/**      → bash/pwsh 等真正起子进程的消费者
  #   - tools/terminal/**     → PTY 起进程（同一条 os/exec 路径）
  #   - tools/jobs/**         → 后台任务进程管理
  #   - kit/**                → 唯一的装配层：把 runner 接进策略与工具面的地方
  #   - go.mod / go.sum       → 工具链与依赖变化会改变构建/运行期行为
  #   - 本 workflow 文件
  # 已知局限（写进 docs/RELEASE.md 与 CONTRIBUTING.md）：如果 PR 只改了"上面没列到
  # 的 Go 代码"却仍可能影响沙箱行为（例如 sandbox 的跨包调用方），它不会自动触发——
  # 此时用 `workflow_dispatch` 手动跑（Actions → "macos sandbox" → Run workflow）。
  pull_request:
    paths:
      - "sandbox/**"
      - "internal/procattr/**"
      - "tools/builtin/**"
      - "tools/terminal/**"
      - "tools/jobs/**"
      - "kit/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 目的同 windows-sandbox：Seatbelt 的行为只有真机 macOS 能验。此前 macOS 后端
  # 只有"渲染出的 SBPL 文本"层面的断言与交叉编译，真机从没跑过——语法正确但
  # 内核不接受、或 syscall 白名单漏项的 SBPL，只有在真机上才会暴露。
  macos-sandbox:
    name: macos sandbox (real macOS)
    # 固定具体镜像而不是 macos-latest：macOS 14 已于 2026-11-02 退役，-latest 会随迁移漂移，
    # 而沙箱测试依赖该系统上 `sandbox-exec` 的实际行为，跑在哪个版本上必须是显式选择。
    #
    # 曾试过 macos-15-intel（x64：4 vCPU / 14 GB，比 arm64 的 3 vCPU / 7 GB 更多），确实跑绿过，
    # 但它的排期容量很不稳定——同一个 commit 的 tag run 上连续两次排队后被取消，导致发布
    # gate 无法收敛。资源够用即可，**可用性优先**，因此回到主流 arm64 镜像。
    # 不用 -large/-xlarge：只对付费计划开放。
    runs-on: macos-26
    # 临时非阻塞：2026-11-18 起 macOS job 被系统性取消——`started_at` 到 `completed_at`
    # 恰好 15 分 02 秒，且 **steps 为空**（一个步骤都没执行），同一天早些时候同一个 job
    # 96 秒就跑绿了。这属于 runner 侧的调度/启动问题，不是我们的测试挂住（已用 -timeout
    # 排除了"用例挂住"这种可能：若有挂住的用例，Go 会先打印 goroutine 栈并以失败退出）。
    # 保留它继续观察与积累日志，但在 runner 恢复稳定之前不让它阻塞发布；恢复后删掉这一行。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      # 加 `-timeout`：一旦某个用例在 macOS 上挂住，Go 会打印**全部 goroutine 栈**并以
      # 失败退出，而不是让 job 一直挂着直到被取消（后者只能看到 "cancelled"，什么也查不到）。
      - name: test (macOS sandbox pure logic)
        run: |
          go test ./sandbox/osrunner -count=1 -v -timeout 8m 2>&1 | tee macos-test.log
          test "${PIPESTATUS[0]}" -eq 0

      # darwin_test.go 自己会探测 sandbox-exec 是否可用（不可用即 skip），
      # 所以这里不需要额外的环境变量门控：真机上它跑真实 Seatbelt 强制。
      - name: test (real Seatbelt enforcement)
        run: |
          go test ./sandbox/osrunner -run 'TestSeatbelt|TestDarwin|TestSandboxExec' -count=1 -v -timeout 8m 2>&1 | tee macos-enforcement.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-sandbox-test-log
          path: |
            macos-test.log
            macos-enforcement.log
          if-no-files-found: warn

